<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>유천엔바이로 계산식 — 오프라인</title>
  <style>
    :root{--ink:#123047;--muted:#617789;--line:#d3e0e8;--paper:#eef4f8;--panel:#f8fbfd;--acid:#62d7ff;--deep:#075985}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif}
    button,input,select{font:inherit}header{height:78px;padding:0 max(24px,5vw);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
    .brand{display:flex;align-items:center}.brand img{display:block;width:auto;height:54px;object-fit:contain}.ready{font:11px Consolas,monospace}.ready i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#6dbb31;box-shadow:0 0 0 4px #dfecd6;margin-right:9px}
    .hero{min-height:290px;padding:58px max(24px,7vw) 48px;display:grid;grid-template-columns:1.2fr .8fr;align-items:end;border-bottom:1px solid var(--line);background-image:linear-gradient(90deg,transparent 49.9%,rgba(20,39,35,.035) 50%);background-size:28px 28px}
    .eyebrow{font:11px Consolas,monospace;letter-spacing:.16em;color:#58716a}h1{font-size:clamp(48px,7vw,88px);line-height:.98;letter-spacing:-.075em;margin:16px 0 0}h1 em{font-style:normal;box-shadow:inset 0 -17px var(--acid)}
    .hero p:last-child{max-width:390px;justify-self:end;color:var(--muted);font-size:14px;line-height:1.85}
    .hero.simple-hero{min-height:220px;display:flex;align-items:center;padding-block:48px}.hero.simple-hero h1{margin:0;font-size:clamp(42px,6vw,76px)}
    .home-screen{max-width:1200px;margin:auto;padding:64px max(24px,6vw) 80px;background:var(--panel);border-inline:1px solid var(--line)}.home-copy{max-width:620px;margin-bottom:34px}.home-kicker{color:var(--deep);font:500 10px Consolas,monospace;letter-spacing:.16em}.home-copy h2{margin:13px 0 10px;font-size:clamp(30px,4vw,48px);letter-spacing:-.055em}.home-copy p{margin:0;color:var(--muted);font-size:13px;line-height:1.7}.category-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.category-card{position:relative;min-height:190px;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;gap:8px;padding:24px;border:1px solid var(--line);background:#fff;text-align:left;cursor:pointer;overflow:hidden;transition:background-color .35s ease,border-color .35s ease,color .35s ease,transform .35s ease,box-shadow .35s ease}.category-card:hover,.category-card:focus-visible{background:var(--deep);border-color:var(--deep);color:#fff;transform:translateY(-3px);box-shadow:0 14px 28px #07598524;outline:none}.category-number{position:absolute;top:20px;left:24px;color:var(--deep);font:500 11px Consolas,monospace;letter-spacing:.12em}.category-card:hover .category-number,.category-card:focus-visible .category-number{color:var(--acid)}.category-label{font-size:clamp(19px,2.4vw,27px);font-weight:700;letter-spacing:-.045em}.category-description{color:var(--muted);font-size:12px;line-height:1.5}.category-card:hover .category-description,.category-card:focus-visible .category-description{color:#c3e5f2}.category-arrow{position:absolute;top:18px;right:22px;color:var(--deep);font-size:22px;opacity:.75;transition:color .35s ease,transform .35s ease}.category-card:hover .category-arrow,.category-card:focus-visible .category-arrow{color:var(--acid);transform:translate(2px,-2px)}
    .work{position:relative;max-width:1200px;margin:auto;display:grid;grid-template-columns:285px 1fr;border-inline:1px solid var(--line);transition:grid-template-columns .54s cubic-bezier(.22,.75,.25,1)}.work.nav-closed{grid-template-columns:0 1fr}.work nav{min-width:0;padding:72px 22px 38px;border-right:1px solid var(--line);overflow:hidden;opacity:1;transition:opacity .3s ease,padding .54s ease}.work.nav-closed nav{padding-inline:0;opacity:0;border-right:0;pointer-events:none}.menu-toggle{position:absolute;z-index:5;top:18px;left:18px;width:42px;height:42px;border:1px solid #bac4c0;background:var(--panel);color:var(--deep);font-size:21px;line-height:1;cursor:pointer;transition:background-color .3s ease,color .3s ease,border-color .3s ease}.menu-toggle:hover{background:var(--deep);border-color:var(--deep);color:#fff}
    nav>p{display:flex;justify-content:space-between;color:var(--muted);font:10px Consolas,monospace;letter-spacing:.15em;margin:0 8px 18px}
    .sub-picker{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:24px 0 0}.sub-picker button{min-height:48px;border:1px solid #b8cad6;background:#fff;padding:10px 12px;font-size:12px;font-weight:700;cursor:pointer;transition:background-color .54s ease,border-color .54s ease,color .54s ease,transform .45s ease}.sub-picker button:hover{background:#e7f2f8;border-color:#78a6c1;transform:translateY(-1px)}.sub-picker button.active{background:var(--deep);border-color:var(--deep);color:#fff}.sub-picker button.active:hover{background:#034a75;border-color:#034a75}.sub-picker small{display:block;margin-top:3px;color:#7790a1;font:9px Consolas,monospace}.sub-picker button.active small{color:#c4dfed}
    .mode-switch{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:3px;background:#e2eef6;border:1px solid var(--line)}.mode-switch button{flex:1;min-height:42px;border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:700;cursor:pointer;transition:background-color .54s ease,color .54s ease,box-shadow .54s ease}.mode-switch button.active{background:#fff;color:var(--deep);box-shadow:0 1px 4px #1230471a}.mode-switch span{color:#668397;font-size:17px}
    nav button{width:100%;min-height:70px;padding:11px;display:grid;grid-template-columns:32px 1fr 20px;align-items:center;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer;transition:background-color .54s ease,color .54s ease,transform .54s ease}
    nav button:last-of-type{border-bottom:1px solid var(--line)}nav button:hover{background:#e2eef6}nav button.active{background:var(--deep);color:white}nav button.active:hover{background:#034a75}.num{color:#7b94a5;font:10px Consolas,monospace}.label{display:inline-block;font-size:14px;font-weight:700}.label small{display:block;margin-top:5px;color:#7d94a3;font:9px Consolas,monospace}.arrow{color:var(--acid);opacity:0}.active .arrow{opacity:1}
    .note{display:flex;gap:10px;color:var(--muted);font-size:11px;line-height:1.6;margin:24px 8px}.calc{padding:45px clamp(26px,6vw,72px) 60px;background:var(--panel)}
    .calc-head{display:flex;justify-content:space-between;align-items:end;padding-bottom:24px;border-bottom:2px solid var(--ink)}.count{color:var(--muted);font:10px Consolas,monospace}h2{margin:7px 0 0;font-size:36px;letter-spacing:-.05em}.reset{border:0;background:none;color:var(--muted);font-size:11px;cursor:pointer}
    .fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;padding:30px 0 36px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:9px}.input{height:52px;display:flex;align-items:center;background:white;border:1px solid #b8cad6}.input:focus-within{border-color:var(--deep);box-shadow:0 0 0 3px #07598518}.input input{width:100%;min-width:0;border:0;outline:0;padding:0 14px;font:500 16px Consolas,monospace}.input span{padding:0 13px;border-left:1px solid var(--line);color:var(--muted);font:11px Consolas,monospace;white-space:nowrap}
    .input:has(input[readonly]),.input input[readonly]{background:#e8f0f5;color:#5f7483}.input input[readonly]{cursor:not-allowed}
    select{width:100%;height:52px;padding:0 13px;background:white;border:1px solid #bac4c0;font:13px Consolas,monospace}.hint{display:block;color:#87938f;font-size:10px;margin-top:7px}
    .result{position:relative;background:var(--deep);color:white;padding:28px 30px 25px;overflow:hidden}.result:after{content:"≈";position:absolute;right:20px;top:22px;color:#c9ff421c;font:140px Consolas,monospace}.result-top{display:flex;justify-content:space-between;align-items:center;color:#eef5f2;font:700 17px "Malgun Gothic",sans-serif;letter-spacing:-.02em}.live{color:var(--acid);font:9px Consolas,monospace;letter-spacing:.15em}.big{position:relative;z-index:1;margin-top:20px;font:500 clamp(40px,6vw,68px)/1 Consolas,monospace;letter-spacing:-.06em}.big small{font-size:17px;color:var(--acid)}.big.dual{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;font-size:clamp(32px,4vw,50px)}.dual-item{min-width:0}.dual-item b{display:block;margin-bottom:10px;color:#b8c8c3;font:600 11px "Malgun Gothic",sans-serif;letter-spacing:0}.detail{position:relative;z-index:1;color:#b9c8c4;font-size:11px}.formula{position:relative;z-index:1;display:flex;gap:20px;padding-top:15px;margin-top:23px;border-top:1px solid #ffffff26;color:#d9e3e0;font:11px/1.6 Consolas,monospace}.formula b{color:#92a39e;font-family:inherit}.copy{position:absolute;right:28px;bottom:20px;z-index:2;border:1px solid #ffffff40;background:none;color:white;padding:8px 12px;font-size:10px;cursor:pointer}
    footer{padding:25px max(24px,5vw);border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:10px;line-height:1.6}
    @keyframes contentIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}.calc.switching .fields,.calc.switching .result{animation:contentIn .72s cubic-bezier(.22,.75,.25,1) both}.calc.switching .result{animation-delay:.1125s}
    @keyframes resetLine{0%,100%{border-color:#b8cad6;box-shadow:none}45%{border-color:#1677a7;box-shadow:0 0 0 3px #1677a71f}}@keyframes resetLabel{0%,100%{color:var(--ink)}45%{color:#0d6f9f}}.field.reset-animate .input,.field.reset-animate select{animation:resetLine .58s ease both}.field.reset-animate>label{animation:resetLabel .58s ease both}
    @media(max-width:780px){.hero{grid-template-columns:1fr;gap:25px;min-height:340px}.hero p:last-child{justify-self:start}.home-screen{border:0;padding-top:48px}.work,.work.nav-closed{grid-template-columns:1fr;border:0}.work nav{display:flex;gap:8px;overflow-x:auto;padding:72px 22px 22px;border-right:0;border-bottom:1px solid var(--line)}.work.nav-closed nav{display:none}.work.nav-closed .calc{padding-top:86px}nav>p,.note{display:none}nav button{flex:0 0 160px;min-height:60px;border:1px solid var(--line)!important;grid-template-columns:1fr 18px}.num{display:none}.calc{padding:86px 24px 48px}.sub-picker{flex-direction:column}}
    @media(max-width:520px){.home-screen{padding:40px 20px 56px}.category-grid{grid-template-columns:1fr}.category-card{min-height:160px;padding:22px}}
    @media(max-width:520px){header{height:68px}.brand img{height:43px}.ready{font-size:9px}.hero{padding-top:44px}h1{font-size:52px}.fields{grid-template-columns:1fr}.result{padding:25px 21px 74px}.big.dual{grid-template-columns:1fr}.formula{flex-direction:column;gap:5px}.copy{left:21px;right:21px;width:calc(100% - 42px)}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <header><div class="brand" id="brand"><img src="yucheon-enviro-logo.png" alt="유천엔바이로 YUCHEON ENVIRO"></div></header>
  <section class="hero simple-hero"><h1>유천엔바이로 계산식</h1></section>
  <section class="home-screen" id="homeScreen" aria-labelledby="homeTitle">
    <div class="home-copy"><span class="home-kicker">YU CHEON ENVIRO · CALCULATORS</span><h2 id="homeTitle">계산 항목을 선택하세요</h2><p>필요한 대분류를 선택하면 세부 계산 항목으로 이동합니다.</p></div>
    <div class="category-grid">
      <button class="category-card" data-home="hydraulic"><span class="category-number">01</span><span class="category-label">수리계산</span><span class="category-description">월류수심 · 오리피스 · V-노치 · 필요구경</span><span class="category-arrow">↗</span></button>
      <button class="category-card" data-home="mixing"><span class="category-number">02</span><span class="category-label">혼화조</span><span class="category-description">급속·완속 혼화조 용적 및 체류시간</span><span class="category-arrow">↗</span></button>
      <button class="category-card" data-home="chemical"><span class="category-number">03</span><span class="category-label">약품투입량</span><span class="category-description">PAC·폴리머 투입량 계산</span><span class="category-arrow">↗</span></button>
      <button class="category-card" data-home="coagulant"><span class="category-number">04</span><span class="category-label">무기응집제투입량계산식</span><span class="category-description">T-P 기준 무기응집제 투입량 계산</span><span class="category-arrow">↗</span></button>
    </div>
  </section>
  <section class="work nav-closed" id="workspace">
    <button class="menu-toggle" id="menuToggle" aria-label="대분류 메뉴 열기" aria-expanded="false">☰</button>
    <nav id="nav"><p>CALCULATORS <span>05</span></p></nav>
    <article class="calc">
      <div class="calc-head"><div><span class="count" id="count"></span><h2 id="title"></h2></div><button class="reset" id="reset">↻ 입력 초기화</button></div>
      <div class="fields" id="fields"></div>
      <div class="result"><div class="result-top"><span id="resultLabel">계산 결과</span></div><div class="big" id="value"></div><div class="formula"><b>계산식</b><span id="formula"></span></div><p class="detail" id="detail"></p><button class="copy" id="copy">결과 복사</button></div>
    </article>
  </section>
  <footer>단위와 입력 조건을 반드시 재확인하세요. 실제 설계·약품 투입 전에는 공인 기준 및 담당 기술자의 검토가 필요합니다.<br>유천엔바이로 계산식 · v1.0</footer>
  <script>
    const tools=[
      {id:"depth",label:"월류수심"},
      {id:"flow",label:"시설용량(평웨어)"},
      {id:"orifice",label:"오리피스"},
      {id:"vnotch",label:"V-노치"},
      {id:"diameter",label:"필요구경"},
      {id:"pac",label:"PAC 투입량"},
      {id:"polymer",label:"폴리머 투입량"},
      {id:"mixing",label:"혼화조"},
      {id:"coagulant",label:"무기응집제투입량계산식"}
    ];
    const navTools=[
      {id:"hydraulic",label:"수리계산"},
      {id:"mixing",label:"혼화조"},
      {id:"chemical",label:"약품투입량"},
      {id:"coagulant",label:"무기응집제투입량계산식"}
    ];
    const defaults={flow:{weirLength:"2.5",overflowDepth:"150"},depth:{capacity:"23089.18",weirLength:"2.5"},orifice:{capacity:"1000",type:"rect",width:"0.5",height:"0.4",coefficient:"0.62"},vnotch:{capacity:"100",notchCount:"1"},diameter:{velocity:"0.8",capacity:"1000"},pac:{mode:"minute",capacity:"1000",dose:"20",specificGravity:"1.2",operationHours:"24",minuteDose:"10"},polymer:{capacity:"1000",dose:"2",dissolution:"0.2"},mixing:{mode:"rapid",capacity:"1000",length:"2",width:"2",height:"2.5",rapidValues:{capacity:"1000",length:"2",width:"2",height:"2.5"},slowValues:{capacity:"1000",length:"2",width:"2",height:"2.5"}},coagulant:{capacity:"1000",influentTP:"2",targetTP:"0.2",chemicalConcentration:"17",specificGravity:"1.368",molarRatio:"3.2"}};
    const emptyValues={flow:{weirLength:"",overflowDepth:""},depth:{capacity:"",weirLength:""},orifice:{capacity:"",type:"rect",width:"",height:"",coefficient:""},vnotch:{capacity:"",notchCount:""},diameter:{velocity:"",capacity:""},pac:{mode:"minute",capacity:"",dose:"",specificGravity:"",operationHours:"",minuteDose:""},polymer:{capacity:"",dose:"",dissolution:""},coagulant:{capacity:"",influentTP:"",targetTP:"",chemicalConcentration:"",specificGravity:"",molarRatio:""}};
    let state=JSON.parse(JSON.stringify(defaults)),active="home";
    const $=s=>document.querySelector(s),num=v=>Number(String(v).replaceAll(",","")),pretty=v=>Number.isFinite(v)?v.toLocaleString("ko-KR",{maximumFractionDigits:2}):"입력 확인";
    function field(key,label,unit,hint=""){return `<div class="field"><label for="${key}">${label}</label><div class="input"><input id="${key}" data-key="${key}" inputmode="decimal" value="${state[active][key]}"><span>${unit}</span></div>${hint?`<small class="hint">${hint}</small>`:""}</div>`}
    function select(key,label,opts){return `<div class="field"><label for="${key}">${label}</label><select id="${key}" data-key="${key}">${Object.entries(opts).map(([v,l])=>`<option value="${v}" ${state[active][key]===v?"selected":""}>${l}</option>`).join("")}</select></div>`}
    function calc(){
      let s=state[active],r;
      if(active==="flow"){let v=1.84*num(s.weirLength)*Math.pow(num(s.overflowDepth)/1000,1.5)*86400;r={v,u:"m³/day",d:"웨어 길이와 월류수심으로 산정한 일 시설용량",f:`1.84 × ${s.weirLength||0} × (${s.overflowDepth||0} ÷ 1,000)^(3/2) × 86,400`}}
      if(active==="depth"){let v=1000*Math.pow(num(s.capacity)/(1.84*num(s.weirLength)*86400),2/3);r={v,u:"mm",d:"시설용량과 웨어길이로 역산한 월류수심",f:`1,000 × [${s.capacity||0} ÷ (1.84 × ${s.weirLength||0} × 86,400)]^(2/3)`}}
      if(active==="orifice"){let area=s.type==="rect"?num(s.width)*num(s.height):Math.PI*Math.pow(num(s.width),2)/4,q=num(s.capacity)/86400,v=Math.pow(q/(num(s.coefficient)*area),2)/(2*9.81)*1000,type=s.type==="rect"?"사각":"원형";r={v,u:"mm",d:`${type} 타공면적 ${pretty(area,4)} m² 기준 수두 손실`,f:`[(${s.capacity||0} ÷ 86,400) ÷ (${s.coefficient||0} × ${pretty(area,4)})]² ÷ (2 × 9.81) × 1,000`}}
      if(active==="vnotch"){let capacity=num(s.capacity),coefficient=capacity<=100?0.392:capacity<=150?0.593:capacity<=200?0.813:1.42,v=Math.pow((capacity/num(s.notchCount)/86400)/coefficient,2/5)*1000;r={v,u:"mm",d:`시설용량 기준 유량계수 ${coefficient} 자동 적용`,f:`[((${s.capacity||0} ÷ ${s.notchCount||0} ÷ 86,400) ÷ ${coefficient})]^(2/5) × 1,000`};let cf=document.querySelector("#vCoefficient");if(cf)cf.value=coefficient}
      if(active==="diameter"){let v=1129*Math.sqrt((num(s.capacity)/86400)/num(s.velocity));r={v,u:"mm",d:"설계 유속과 시설용량으로 산정한 필요 관경",f:`1,129 × √[( ${s.capacity||0} ÷ 86,400 ) ÷ ${s.velocity||0}]`}}
      if(active==="pac"){if(s.mode==="ppm"){let v=num(s.minuteDose)*num(s.specificGravity)*60*24/num(s.capacity);r={v,u:"ppm",d:"비중 및 24시간 연속 투입 기준 환산 농도",f:`${s.minuteDose||0} × ${s.specificGravity||0} × 60 × 24 ÷ ${s.capacity||0}`}}else{let daily=((num(s.capacity)*num(s.dose))/num(s.specificGravity))*1e-3,minute=daily/(60*num(s.operationHours))*1000;r={v:daily,u:"L/day",v2:minute,u2:"mL/min",d:"PAC 일일 필요량 및 실제 가동시간 기준 분당 투입량",f:`일일: ((${s.capacity||0} × ${s.dose||0}) ÷ ${s.specificGravity||0}) × 10⁻³  |  분당: ${pretty(daily)} ÷ (60 × ${s.operationHours||0}) × 1,000`}}}
      if(active==="polymer"){let solid=num(s.capacity)*num(s.dose)*1e-3,solution=solid/(num(s.dissolution)/100),minute=solution/1440*1000;r={v:solid,u:"kg/day",v2:solution,u2:"L/day",v3:minute,u3:"mL/min",d:"24시간 가동 및 용해액 밀도 1 kg/L 기준",f:`고상: ${s.capacity||0} × ${s.dose||0} × 10⁻³  |  용해액: ${pretty(solid)} ÷ (${s.dissolution||0} ÷ 100)  |  분당: ${pretty(solution)} ÷ 1,440 × 1,000`}}
      if(active==="mixing"){let volume=num(s.length)*num(s.width)*num(s.height),v=volume/(num(s.capacity)/1440),type=s.mode==="rapid"?"급속":"완속";r={v,u:"min",d:`${type} · 계산 용적 ${pretty(volume)} m³`,f:`(${s.length||0} × ${s.width||0} × ${s.height||0}) ÷ (${s.capacity||0} ÷ 1,440)`};let vf=document.querySelector("#mixVolume");if(vf)vf.value=pretty(volume)}
      if(active==="coagulant"){let al=(num(s.influentTP)-num(s.targetTP))*num(s.molarRatio)*(27/31),chemical=al*(102/54)/(num(s.chemicalConcentration)/100),minute=chemical/1440/num(s.specificGravity)*num(s.capacity),daily=minute*1440/1000;r={v:chemical,u:"mg/L(ppm)",v2:minute,u2:"mL/min",v3:daily,u3:"L/day",d:`중간 계산 Al 주입량 ${pretty(al)} mg/L`,f:`Al: (${s.influentTP||0} − ${s.targetTP||0}) × ${s.molarRatio||0} × (27 ÷ 31)  |  약품: ${pretty(al)} × (102 ÷ 54) ÷ (${s.chemicalConcentration||0} ÷ 100)  |  분당: ${pretty(chemical)} ÷ 1,440 ÷ ${s.specificGravity||0} × ${s.capacity||0}  |  일사용: ${pretty(minute)} × 1,440 ÷ 1,000`}}
      if(!r)r={v:NaN,u:"",d:"계산 항목을 선택해 주세요.",f:""}
      const resultLabels={flow:"시설용량",depth:"월류수심",orifice:"손실",vnotch:"월류수심",diameter:"구경",pac:s.mode==="ppm"?"ppm":"PAC 투입량 결과",polymer:"폴리머 투입량 결과",mixing:"체류시간",coagulant:"무기응집제 투입량 결과"};$("#resultLabel").textContent=resultLabels[active]||"계산 결과";let valueEl=$("#value");valueEl.className=r.v2!==undefined?"big dual":"big";valueEl.innerHTML=active==="coagulant"?`<div class="dual-item"><b>약품투입량</b>${pretty(r.v)} <small>${r.u}</small></div><div class="dual-item"><b>분당투입량</b>${pretty(r.v2)} <small>${r.u2}</small></div><div class="dual-item"><b>일사용량</b>${pretty(r.v3)} <small>${r.u3}</small></div>`:r.v3!==undefined?`<div class="dual-item"><b>고상</b>${pretty(r.v)} <small>${r.u}</small></div><div class="dual-item"><b>용해액 사용</b>${pretty(r.v2)} <small>${r.u2}</small></div><div class="dual-item"><b>분당 투입량</b>${pretty(r.v3)} <small>${r.u3}</small></div>`:r.v2!==undefined?`<div class="dual-item"><b>일일 필요량</b>${pretty(r.v)} <small>${r.u}</small></div><div class="dual-item"><b>분당 투입량</b>${pretty(r.v2)} <small>${r.u2}</small></div>`:`${pretty(r.v)} <small>${Number.isFinite(r.v)?r.u:""}</small>`;$("#detail").textContent=Number.isFinite(r.v)&&r.v>=0?r.d:"0보다 큰 유효한 값을 입력해 주세요.";$("#formula").textContent=r.f;return r;
    }
    function render(action="switch"){
      if(active==="home"){$("#homeScreen").style.display="";$("#workspace").style.display="none";return}
      $("#homeScreen").style.display="none";$("#workspace").style.display="";
      const hydraulic=["flow","depth","orifice","vnotch","diameter"].includes(active);
      const chemical=["pac","polymer"].includes(active);
      $("#nav").innerHTML=`<p>CALCULATORS <span>04</span></p>`+navTools.map((t,i)=>`<button data-tool="${t.id}" class="${(t.id==="hydraulic"&&hydraulic)||(t.id==="chemical"&&chemical)||active===t.id?"active":""}"><span class="num">0${i+1}</span><span class="label">${t.label}</span><span class="arrow">↗</span></button>`).join("")+`<div class="note">ⓘ <span>계산 결과는 설계 및 운전 검토를 위한 참고값입니다.</span></div>`;
      let navId=hydraulic?"hydraulic":chemical?"chemical":active,i=navTools.findIndex(t=>t.id===navId),s=state[active],html="";
      $("#count").textContent=`0${i+1} / 04`;$("#title").textContent=hydraulic?"수리계산":chemical?"약품투입량":tools.find(t=>t.id===active).label;
      if(active==="flow")html=field("overflowDepth","월류수심","mm")+field("weirLength","웨어길이","m");
      if(active==="depth")html=field("capacity","시설용량","m³/day")+field("weirLength","웨어길이","m");
      if(active==="orifice")html=field("capacity","시설용량","m³/day")+select("type","타공유형",{rect:"사각",circle:"원형"})+field("width","폭 or 직경","m")+(s.type==="rect"?field("height","높이","m"):"")+field("coefficient","유량계수","");
      if(active==="vnotch"){let capacity=num(s.capacity),coefficient=capacity<=100?0.392:capacity<=150?0.593:capacity<=200?0.813:1.42;html=field("capacity","시설용량","m³/day")+`<div class="field"><label for="vCoefficient">유량계수</label><div class="input"><input id="vCoefficient" value="${coefficient}" readonly><span>자동</span></div><small class="hint">시설용량 구간에 따라 자동 적용</small></div>`+field("notchCount","노치수량","개")}
      if(active==="diameter")html=field("velocity","유속","m/s")+field("capacity","시설용량","m³/day");
      if(active==="pac")html=`<div class="mode-switch"><button data-mode="minute" class="${s.mode==="minute"?"active":""}">분당투입량(mL/min)</button><span>⇋</span><button data-mode="ppm" class="${s.mode==="ppm"?"active":""}">ppm</button></div>`+(s.mode==="ppm"?field("capacity","시설용량","m³/day")+field("minuteDose","분당 투입량","mL/min")+field("specificGravity","비중",""):field("capacity","시설용량","m³/day")+field("dose","투입량","mg/L(ppm)")+field("specificGravity","비중","")+field("operationHours","가동시간","hr/day"));
      if(active==="polymer")html=field("capacity","시설용량","m³/day")+field("dose","투입량","mg/L(ppm)")+field("dissolution","용해농도","%");
      if(active==="mixing"){let volume=num(s.length)*num(s.width)*num(s.height);html=`<div class="mode-switch"><button data-mix-mode="rapid" class="${s.mode==="rapid"?"active":""}">급속</button><span>⇋</span><button data-mix-mode="slow" class="${s.mode==="slow"?"active":""}">완속</button></div>`+field("capacity","시설용량","m³/day")+field("length","가로","m")+field("width","세로","m")+field("height","높이","m")+`<div class="field"><label for="mixVolume">용적</label><div class="input"><input id="mixVolume" value="${pretty(volume)}" readonly><span>m³</span></div><small class="hint">가로 × 세로 × 높이</small></div>`}
      if(active==="coagulant")html=field("capacity","시설용량(유량)","m³/day")+field("influentTP","유입 T-P 농도","mg/L")+field("targetTP","목표 T-P 농도","mg/L")+field("chemicalConcentration","약품 농도","%")+field("specificGravity","비중","")+field("molarRatio","투입율(mol비)","");
      const picker=hydraulic?`<div class="sub-picker"><button data-sub="depth" class="${active==="depth"?"active":""}">월류수심<small>시설용량·웨어길이 → 월류수심</small></button><button data-sub="flow" class="${active==="flow"?"active":""}">시설용량(평웨어)<small>웨어길이·월류수심 → 시설용량</small></button><button data-sub="orifice" class="${active==="orifice"?"active":""}">오리피스<small>타공부 수두 손실</small></button><button data-sub="vnotch" class="${active==="vnotch"?"active":""}">V-노치<small>노치 월류수심</small></button><button data-sub="diameter" class="${active==="diameter"?"active":""}">필요구경<small>유속·시설용량 → 구경</small></button></div>`:chemical?`<div class="sub-picker"><button data-sub="pac" class="${active==="pac"?"active":""}">PAC 투입량</button><button data-sub="polymer" class="${active==="polymer"?"active":""}">폴리머 투입량</button></div>`:"";
      $("#fields").innerHTML=picker+html;calc();
      const calcPanel=document.querySelector(".calc");calcPanel.classList.remove("switching");
      if(action==="reset"){document.querySelectorAll("#fields [data-key]").forEach(el=>el.closest(".field")?.classList.add("reset-animate"))}
      else{void calcPanel.offsetWidth;calcPanel.classList.add("switching")}
      document.querySelectorAll("[data-key]").forEach(el=>el.addEventListener("input",e=>{let key=e.target.dataset.key;state[active][key]=e.target.value;if(active==="mixing")state.mixing[state.mixing.mode+"Values"][key]=e.target.value;calc()}));
      document.querySelectorAll("[data-tool]").forEach(el=>el.addEventListener("click",()=>{active=el.dataset.tool==="hydraulic"?"flow":el.dataset.tool==="chemical"?"pac":el.dataset.tool;render()}));
      document.querySelectorAll("[data-sub]").forEach(el=>el.addEventListener("click",()=>{active=el.dataset.sub;render()}));
      document.querySelectorAll("[data-mode]").forEach(el=>el.addEventListener("click",()=>{state.pac.mode=el.dataset.mode;render()}));
      document.querySelectorAll("[data-mix-mode]").forEach(el=>el.addEventListener("click",()=>{let mode=el.dataset.mixMode,values=state.mixing[mode+"Values"];state.mixing.mode=mode;Object.assign(state.mixing,values);render()}));
    }
    document.querySelectorAll("[data-home]").forEach(el=>el.addEventListener("click",()=>{const id=el.dataset.home;active=id==="hydraulic"?"flow":id==="chemical"?"pac":id;render()}));
    $("#brand").onclick=()=>{active="home";$("#workspace").classList.add("nav-closed");$("#workspace").classList.remove("nav-open");$("#menuToggle").textContent="☰";$("#menuToggle").setAttribute("aria-expanded","false");render()};
    $("#reset").onclick=()=>{if(active==="mixing"){let mode=state.mixing.mode,cleared={capacity:"",length:"",width:"",height:""};state.mixing[mode+"Values"]={...cleared};Object.assign(state.mixing,cleared)}else if(emptyValues[active])state[active]=JSON.parse(JSON.stringify(emptyValues[active]));render("reset")};
    $("#menuToggle").onclick=()=>{const workspace=$("#workspace"),opening=workspace.classList.contains("nav-closed");workspace.classList.toggle("nav-closed",!opening);workspace.classList.toggle("nav-open",opening);$("#menuToggle").textContent=opening?"×":"☰";$("#menuToggle").setAttribute("aria-expanded",String(opening));$("#menuToggle").setAttribute("aria-label",opening?"대분류 메뉴 닫기":"대분류 메뉴 열기")};
    $("#copy").onclick=async()=>{let r=calc(),text=active==="coagulant"?`약품투입량: ${pretty(r.v)} ${r.u}\n분당투입량: ${pretty(r.v2)} ${r.u2}\n일사용량: ${pretty(r.v3)} ${r.u3}`:r.v3!==undefined?`고상: ${pretty(r.v)} ${r.u}\n용해액 사용: ${pretty(r.v2)} ${r.u2}\n분당 투입량: ${pretty(r.v3)} ${r.u3}`:r.v2!==undefined?`일일 필요량: ${pretty(r.v)} ${r.u}\n분당 투입량: ${pretty(r.v2)} ${r.u2}`:`${pretty(r.v)} ${r.u}`;try{await navigator.clipboard.writeText(text)}catch{prompt("아래 결과를 복사하세요.",text)}$("#copy").textContent="✓ 복사됨";setTimeout(()=>$("#copy").textContent="결과 복사",1500)};
    render();
  </script>
</body>
